<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Make a new admin login</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#0b0b0c;color:#f2f1ee;max-width:560px;margin:40px auto;padding:0 20px}input,textarea{width:100%;font:inherit;padding:11px;margin:6px 0 14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{font:inherit;font-weight:700;padding:11px 20px;border-radius:99px;border:0;background:#f2b01e;color:#111;cursor:pointer}small{color:#999}</style></head><body>
<h1>Make a new admin login</h1><p><small>Everything happens in this page, on your computer. Nothing is sent anywhere. Use it if you forgot your password.</small></p>
<label>Username<input id="u" autocomplete="off"></label><label>Password (10+ characters)<input id="p" type="password" autocomplete="off"></label><button id="b">Create admin-login.js</button>
<p id="m"></p><textarea id="o" rows="4" readonly style="display:none"></textarea><p id="d" style="display:none"><small>Upload the downloaded <b>admin-login.js</b> to your GitHub repository, replacing the old one. Your new login works after the site updates.</small></p>
<script>
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function make(u,p){const s=hex(crypto.getRandomValues(new Uint8Array(16))),it=210000,k=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveBits']);
 const h=hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new Uint8Array(s.match(/../g).map(x=>parseInt(x,16))),iterations:it},k,256));return 'window.ADMIN_LOGIN='+JSON.stringify({v:1,iter:it,salt:s,hash:h,temp:false})+';\n'}
b.onclick=async()=>{if(!u.value.trim()||p.value.length<10){m.textContent='Enter a username and a password of at least 10 characters.';return}
 const t=await make(u.value,p.value);o.value=t;o.style.display=d.style.display='block';m.textContent='';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));a.download='admin-login.js';a.click()};
</script></body></html>
